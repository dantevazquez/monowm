# ==============================================================================
# Monowm Window Switcher Appearance (switcher.conf)
# ==============================================================================
switcher_font_name = JetBrainsMono Nerd Font
switcher_font_size = 11

# Adjust size of super tab preview windows (25-200)
switcher_tile_scale = 100

# Fullscreen overlay background
switcher_color_background = #15171d

# Window card background and inactive border
switcher_color_card = #252831
switcher_color_border = #4b5263

# Border around the currently selected window
switcher_color_selected = #8aadf4

# Letterbox/background behind window previews
switcher_color_preview_background = #090a0d

# Window titles and secondary text
switcher_color_text = #f4f4f5
switcher_color_muted = #a6adc8
